<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terrain Tools</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         TERRAIN TOOLS PANEL
    ====================================================== -->

    <aside class="terrain-panel">

        <!-- PANEL HEADER -->

        <div class="panel-header">

            <div class="panel-brand">

                <div class="brand-mark">
                    ◈
                </div>

                <div class="brand-text">

                    <div class="panel-title">
                        TERRAIN TOOLS
                    </div>

                    <div class="panel-subtitle">
                        TERRAIN EDITOR
                    </div>

                </div>

            </div>

            <button
                class="panel-menu"
                title="Terrain tools menu"
            >
                ⋮
            </button>

        </div>


        <!-- =================================================
             TERRAIN VIEW
        ================================================== -->

        <section class="control-section">

            <div
                class="section-title"
                onclick="toggleSection(this)"
            >

                <div class="section-title-left">

                    <span class="section-indicator"></span>

                    <span class="section-name">
                        TERRAIN VIEW
                    </span>

                </div>

                <span class="arrow">
                    ▾
                </span>

            </div>


            <div class="section-content">

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        <span class="button-main">
                            Exaggerate
                        </span>

                        <span class="button-value">
                            1.0×
                        </span>
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Elevation colours
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Slope shading
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Contours
                    </button>


                    <button
                        class="tool-button wide"
                        onclick="activateTool(this)"
                    >
                        Water level
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             SCULPT BRUSH
        ================================================== -->

        <section class="control-section">

            <div
                class="section-title"
                onclick="toggleSection(this)"
            >

                <div class="section-title-left">

                    <span class="section-indicator"></span>

                    <span class="section-name">
                        SCULPT BRUSH
                    </span>

                </div>

                <span class="arrow">
                    ▾
                </span>

            </div>


            <div class="section-content">


                <!-- TOOL MODE -->

                <div class="tool-mode-grid">

                    <button
                        class="mode-button"
                        onclick="selectBrushMode(this)"
                    >
                        <span class="mode-icon">
                            ◇
                        </span>

                        <span>
                            Modify terrain
                        </span>

                    </button>


                    <button
                        class="mode-button selected"
                        onclick="selectBrushMode(this)"
                    >
                        <span class="mode-icon">
                            ▲
                        </span>

                        <span>
                            Brush: RAISE
                        </span>

                    </button>

                </div>


                <!-- RADIUS -->

                <div class="value-control">

                    <div class="value-info">

                        <span class="value-label">
                            Radius
                        </span>

                        <span
                            class="value-number"
                            id="radiusValue"
                        >
                            1500 m
                        </span>

                    </div>


                    <div class="mini-stepper">

                        <button
                            onclick="changeRadius(-100)"
                        >
                            −
                        </button>

                        <button
                            onclick="changeRadius(100)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- POWER -->

                <div class="value-control">

                    <div class="value-info">

                        <span class="value-label">
                            Power
                        </span>

                        <span
                            class="value-number"
                            id="powerValue"
                        >
                            2.0 m
                        </span>

                    </div>


                    <div class="mini-stepper">

                        <button
                            onclick="changePower(-0.5)"
                        >
                            −
                        </button>

                        <button
                            onclick="changePower(0.5)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- MAX HEIGHT -->

                <div class="value-control">

                    <div class="value-info">

                        <span class="value-label">
                            Max height
                        </span>

                        <span
                            class="value-number"
                            id="maxHeightValue"
                        >
                            499 m
                        </span>

                    </div>


                    <div class="mini-stepper">

                        <button
                            onclick="changeMaxHeight(-1)"
                        >
                            −
                        </button>

                        <button
                            onclick="changeMaxHeight(1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- DIVIDER -->

                <div class="control-divider"></div>


                <!-- UNDO / REDO -->

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="performAction('Undo')"
                    >
                        <span class="action-icon">
                            ↶
                        </span>

                        Undo
                    </button>


                    <button
                        class="tool-button"
                        onclick="performAction('Redo')"
                    >
                        <span class="action-icon">
                            ↷
                        </span>

                        Redo
                    </button>

                </div>


                <!-- RESET -->

                <button
                    class="reset-button"
                    onclick="performAction('Reset')"
                >
                    <span>
                        ↻
                    </span>

                    Reset terrain
                </button>

            </div>

        </section>


        <!-- =================================================
             SHAPING TOOLS
        ================================================== -->

        <section class="control-section">

            <div
                class="section-title"
                onclick="toggleSection(this)"
            >

                <div class="section-title-left">

                    <span class="section-indicator"></span>

                    <span class="section-name">
                        SHAPING TOOLS
                    </span>

                </div>

                <span class="arrow">
                    ▾
                </span>

            </div>


            <div class="section-content">


                <!-- GRADE TOOLS -->

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        <span class="button-icon">
                            ╱
                        </span>

                        Grade path: ROAD
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        <span class="button-icon">
                            ━
                        </span>

                        Grade flatten
                    </button>

                </div>


                <!-- PATH WIDTH -->

                <div class="field-control">

                    <label>
                        PATH WIDTH
                        <span>(m)</span>
                    </label>


                    <div class="field-row">

                        <input
                            type="number"
                            id="pathWidth"
                            value="500"
                        >


                        <button
                            onclick="changeInput('pathWidth', -10)"
                        >
                            −
                        </button>


                        <button
                            onclick="changeInput('pathWidth', 10)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <!-- DIG DEPTH -->

                <div class="field-control">

                    <label>
                        DIG DEPTH
                        <span>(m, +down)</span>
                    </label>


                    <div class="field-row">

                        <input
                            type="number"
                            id="digDepth"
                            value="0"
                        >


                        <button
                            onclick="changeInput('digDepth', -1)"
                        >
                            −
                        </button>


                        <button
                            onclick="changeInput('digDepth', 1)"
                        >
                            +
                        </button>

                    </div>

                </div>


                <div class="control-divider"></div>


                <!-- SHAPING ACTIONS -->

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Stamp: DOME
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Cross-section
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Region offset
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Rgn up
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Rgn dn
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             EROSION / EARTHWORK
        ================================================== -->

        <section class="control-section">

            <div
                class="section-title"
                onclick="toggleSection(this)"
            >

                <div class="section-title-left">

                    <span class="section-indicator"></span>

                    <span class="section-name">
                        EROSION / EARTHWORK
                    </span>

                </div>

                <span class="arrow">
                    ▾
                </span>

            </div>


            <div class="section-content">

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Erode (water)
                    </button>


                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Talus
                    </button>


                    <button
                        class="tool-button wide"
                        onclick="activateTool(this)"
                    >
                        Balance cut/fill
                    </button>

                </div>

            </div>

        </section>

        


        <!-- =================================================
             SELECTION / MASK
        ================================================== -->

        <section class="control-section">

            <div
                class="section-title"
                onclick="toggleSection(this)"
            >

                <div class="section-title-left">

                    <span class="section-indicator"></span>

                    <span class="section-name">
                        SELECTION / MASK
                    </span>

                </div>

                <span class="arrow">
                    ▾
                </span>

            </div>


            <div class="section-content">

                <div class="button-grid">

                    <button
                        class="tool-button"
                        onclick="activateTool(this)"
                    >
                        Polygon select
                    </button>


                    <button
                        class="tool-button"
                        id="maskButton"
                        onclick="toggleMask(event)"
                    >
                        Mask: OFF
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             STATUS BAR
        ================================================== -->

        <div class="panel-status">

            <span class="status-dot"></span>

            <span id="statusText">
                Terrain editor ready
            </span>

        </div>

    </aside>


    <script src="script.js"></script>

</body>

</html>
