<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terrain Controls</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Example map/background area -->
    

    <!-- Terrain Control Panel -->
    <aside class="terrain-panel">

        <!-- HEADER -->
        <div class="panel-header">
            <div>
                <div class="panel-title">TERRAIN VIEW</div>
                <div class="panel-subtitle">Terrain Visualization & Editing</div>
            </div>

            <button class="collapse-btn" id="collapseBtn">−</button>
        </div>


        <div id="panelContent">

            <!-- ================= TERRAIN VIEW ================= -->
            <section class="control-section">

                <div class="section-title">
                    <span class="section-icon">◈</span>
                    TERRAIN VIEW
                </div>

                <div class="button-grid">

                    <button class="control-btn">
                        <span>Exaggerate</span>
                        <strong>1.0×</strong>
                    </button>

                    <button class="control-btn">
                        Elevation colours
                    </button>

                    <button class="control-btn">
                        Slope shading
                    </button>

                    <button class="control-btn">
                        Contours
                    </button>

                    <button class="control-btn">
                        Water level
                    </button>

                </div>

            </section>


            <!-- ================= SCULPT BRUSH ================= -->
            <section class="control-section">

                <div class="section-title">
                    <span class="section-icon">✦</span>
                    SCULPT BRUSH
                </div>

                <div class="button-grid">

                    <button class="control-btn">
                        Modify terrain
                    </button>

                    <button class="control-btn active">
                        Brush: RAISE
                    </button>

                </div>


                <!-- Radius -->
                <div class="control-row">

                    <div class="control-label">
                        Radius
                        <span id="radiusValue">1500 m</span>
                    </div>

                    <div class="stepper">
                        <button onclick="changeRadius(-100)">−</button>
                        <button onclick="changeRadius(100)">+</button>
                    </div>

                </div>


                <!-- Power -->
                <div class="control-row">

                    <div class="control-label">
                        Power
                        <span id="powerValue">2.0 m</span>
                    </div>

                    <div class="stepper">
                        <button onclick="changePower(-0.5)">−</button>
                        <button onclick="changePower(0.5)">+</button>
                    </div>

                </div>


                <!-- Max Height -->
                <div class="control-row">

                    <div class="control-label">
                        Max ht
                        <span id="maxHeightValue">499 m</span>
                    </div>

                    <div class="stepper">
                        <button onclick="changeMaxHeight(-1)">−</button>
                        <button onclick="changeMaxHeight(1)">+</button>
                    </div>

                </div>


                <!-- Undo / Redo -->
                <div class="button-grid">

                    <button class="control-btn">
                        ↶ &nbsp; Undo
                    </button>

                    <button class="control-btn">
                        ↷ &nbsp; Redo
                    </button>

                    <button class="control-btn danger">
                        Reset
                    </button>

                </div>

            </section>


            <!-- ================= SHAPING TOOLS ================= -->
            <section class="control-section">

                <div class="section-title">
                    <span class="section-icon">◇</span>
                    SHAPING TOOLS
                </div>


                <div class="button-grid">

                    <button class="control-btn">
                        Grade path: ROAD
                    </button>

                    <button class="control-btn">
                        Grade flatten
                    </button>

                </div>


                <!-- Path Width -->
                <div class="input-control">

                    <label>
                        Path width (m)
                    </label>

                    <div class="input-stepper">

                        <input
                            type="number"
                            id="pathWidth"
                            value="500"
                        >

                        <button onclick="changeInput('pathWidth', -10)">
                            −
                        </button>

                        <button onclick="changeInput('pathWidth', 10)">
                            +
                        </button>

                    </div>

                </div>


                <!-- Dig Depth -->
                <div class="input-control">

                    <label>
                        Dig depth (m, +down)
                    </label>

                    <div class="input-stepper">

                        <input
                            type="number"
                            id="digDepth"
                            value="0"
                        >

                        <button onclick="changeInput('digDepth', -1)">
                            −
                        </button>

                        <button onclick="changeInput('digDepth', 1)">
                            +
                        </button>

                    </div>

                </div>


                <div class="button-grid">

                    <button class="control-btn">
                        Stamp: DOME
                    </button>

                    <button class="control-btn">
                        Cross-section
                    </button>

                    <button class="control-btn">
                        Region offset
                    </button>

                    <button class="control-btn">
                        Rgn up
                    </button>

                    <button class="control-btn">
                        Rgn dn
                    </button>

                </div>

            </section>


            <!-- ================= EROSION / EARTHWORK ================= -->
            <section class="control-section">

                <div class="section-title">
                    <span class="section-icon">≈</span>
                    EROSION / EARTHWORK
                </div>

                <div class="button-grid">

                    <button class="control-btn">
                        Erode (water)
                    </button>

                    <button class="control-btn">
                        Talus
                    </button>

                    <button class="control-btn">
                        Balance cut/fill
                    </button>

                </div>

            </section>


            <!-- ================= SELECTION / MASK ================= -->
            <section class="control-section">

                <div class="section-title">
                    <span class="section-icon">⬡</span>
                    SELECTION / MASK
                </div>

                <div class="button-grid">

                    <button class="control-btn">
                        Polygon select
                    </button>

                    <button
                        class="control-btn mask-btn"
                        id="maskButton"
                        onclick="toggleMask()"
                    >
                        Mask: OFF
                    </button>

                </div>

            </section>

        </div>

    </aside>


    <script src="script.js"></script>

</body>
</html>
