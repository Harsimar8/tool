<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terrain Tools</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<aside class="terrain-panel">

    <!-- HEADER -->
    <div class="panel-header">

        <div class="panel-brand">

            <div class="brand-mark">◈</div>

            <div class="brand-text">
                <div class="panel-title">TERRAIN TOOLS</div>
                <div class="panel-subtitle">TERRAIN EDITOR</div>
            </div>

        </div>

        <button class="panel-menu" title="Terrain tools menu">
            ⋮
        </button>

    </div>


    <!-- =====================================================
         TERRAIN VIEW
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">TERRAIN VIEW</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Terrain Exaggeration')"
                >
                    <span class="button-main">Exaggerate</span>
                    <span class="button-value">1.0×</span>
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Elevation Colours')"
                >
                    Elevation colours
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Slope Shading')"
                >
                    Slope shading
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Contours')"
                >
                    Contours
                </button>

                <button
                    class="tool-button wide"
                    onclick="selectOption(this, 'Water Level')"
                >
                    Water level
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         SCULPT BRUSH
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">SCULPT BRUSH</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="tool-mode-grid">

                <button
                    class="mode-button"
                    onclick="selectBrushMode(this)"
                >
                    <span class="mode-icon">◇</span>
                    <span>Modify terrain</span>
                </button>

                <button
                    class="mode-button selected"
                    onclick="selectBrushMode(this)"
                >
                    <span class="mode-icon">▲</span>
                    <span>Brush: RAISE</span>
                </button>

            </div>


            <!-- RADIUS -->

            <div class="value-control">

                <div class="value-info">
                    <span class="value-label">Radius</span>
                    <span class="value-number" id="radiusValue">
                        1500 m
                    </span>
                </div>

                <div class="mini-stepper">

                    <button onclick="changeRadius(-100)">−</button>
                    <button onclick="changeRadius(100)">+</button>

                </div>

            </div>


            <!-- POWER -->

            <div class="value-control">

                <div class="value-info">
                    <span class="value-label">Power</span>
                    <span class="value-number" id="powerValue">
                        2.0 m
                    </span>
                </div>

                <div class="mini-stepper">

                    <button onclick="changePower(-0.5)">−</button>
                    <button onclick="changePower(0.5)">+</button>

                </div>

            </div>


            <!-- MAX HEIGHT -->

            <div class="value-control">

                <div class="value-info">
                    <span class="value-label">Max height</span>
                    <span class="value-number" id="maxHeightValue">
                        499 m
                    </span>
                </div>

                <div class="mini-stepper">

                    <button onclick="changeMaxHeight(-1)">−</button>
                    <button onclick="changeMaxHeight(1)">+</button>

                </div>

            </div>


            <div class="control-divider"></div>


            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="performAction('Undo')"
                >
                    <span class="action-icon">↶</span>
                    Undo
                </button>

                <button
                    class="tool-button"
                    onclick="performAction('Redo')"
                >
                    <span class="action-icon">↷</span>
                    Redo
                </button>

            </div>


            <button
                class="reset-button"
                onclick="performAction('Reset')"
            >
                ↻ Reset terrain
            </button>

        </div>

    </section>


    <!-- =====================================================
         SHAPING TOOLS
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">SHAPING TOOLS</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Grade Path: ROAD')"
                >
                    <span class="button-icon">╱</span>
                    Grade path: ROAD
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Grade Flatten')"
                >
                    <span class="button-icon">━</span>
                    Grade flatten
                </button>

            </div>


            <!-- PATH WIDTH -->

            <div class="field-control">

                <label>
                    PATH WIDTH <span>(m)</span>
                </label>

                <div class="field-row">

                    <input
                        type="number"
                        id="pathWidth"
                        value="500"
                    >

                    <button onclick="changeInput('pathWidth', -10)">
                        −
                    </button>

                    <button onclick="changeInput('pathWidth', 10)">
                        +
                    </button>

                </div>

            </div>


            <!-- DIG DEPTH -->

            <div class="field-control">

                <label>
                    DIG DEPTH <span>(m, +down)</span>
                </label>

                <div class="field-row">

                    <input
                        type="number"
                        id="digDepth"
                        value="0"
                    >

                    <button onclick="changeInput('digDepth', -1)">
                        −
                    </button>

                    <button onclick="changeInput('digDepth', 1)">
                        +
                    </button>

                </div>

            </div>


            <div class="control-divider"></div>


            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Stamp: DOME')"
                >
                    Stamp: DOME
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Cross-section')"
                >
                    Cross-section
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Region Offset')"
                >
                    Region offset
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Region Up')"
                >
                    Rgn up
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Region Down')"
                >
                    Rgn dn
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         EROSION / EARTHWORK
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">EROSION / EARTHWORK</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Erode: Water')"
                >
                    Erode (water)
                </button>

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Talus')"
                >
                    Talus
                </button>

                <button
                    class="tool-button wide"
                    onclick="selectOption(this, 'Balance Cut / Fill')"
                >
                    Balance cut/fill
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         SYMBOLS
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">SYMBOLS</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="symbol-grid">

                <button
                    class="symbol-button"
                    onclick="selectSymbol(this, 'Radar')"
                >
                    <img src="symbols/radar.svg" alt="Radar">
                    <span>Radar</span>
                </button>


                <button
                    class="symbol-button"
                    onclick="selectSymbol(this, 'Missile')"
                >
                    <img src="symbols/missile.svg" alt="Missile">
                    <span>Missile</span>
                </button>


                <button
                    class="symbol-button"
                    onclick="selectSymbol(this, 'Tank')"
                >
                    <img src="symbols/tank.svg" alt="Tank">
                    <span>Tank</span>
                </button>


                <button
                    class="symbol-button"
                    onclick="selectSymbol(this, 'Target')"
                >
                    <img src="symbols/target.svg" alt="Target">
                    <span>Target</span>
                </button>


                <button
                    class="symbol-button"
                    onclick="selectSymbol(this, 'Rocket')"
                >
                    <img src="symbols/rocket.svg" alt="Rocket">
                    <span>Rocket</span>
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         SELECTION / MASK
    ====================================================== -->

    <section class="control-section">

        <div class="section-title" onclick="toggleSection(this)">

            <div class="section-title-left">
                <span class="section-indicator"></span>
                <span class="section-name">SELECTION / MASK</span>
            </div>

            <span class="arrow">▾</span>

        </div>


        <div class="section-content">

            <div class="button-grid">

                <button
                    class="tool-button"
                    onclick="selectOption(this, 'Polygon Select')"
                >
                    Polygon select
                </button>

                <button
                    class="tool-button"
                    id="maskButton"
                    onclick="toggleMask(event)"
                >
                    Mask: OFF
                </button>

            </div>

        </div>

    </section>


    <!-- STATUS -->

    <div class="panel-status">

        <span class="status-dot"></span>

        <span id="statusText">
            Terrain editor ready
        </span>

    </div>

</aside>


<!-- CENTER NOTIFICATION -->

<div
    class="tool-notification"
    id="toolNotification"
>
    <span class="notification-icon">✓</span>

    <span id="notificationText">
        Selected
    </span>
</div>


<script src="script.js"></script>

</body>
</html>
