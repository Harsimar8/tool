<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Terrain Controls</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         TERRAIN CONTROL PANEL
    ========================================== -->

    <aside class="terrain-panel">

        <div id="panelContent">


            <!-- =========================================
                 TERRAIN VIEW
            ========================================== -->

            <section class="control-section">

                <div
                    class="section-title"
                    onclick="toggleSection(this)"
                >

                    <div class="section-title-left">

                        <span class="section-icon">◈</span>

                        <span>TERRAIN VIEW</span>

                    </div>

                    <span class="arrow">⌄</span>

                </div>


                <div class="section-content">

                    <div class="button-grid">

                        <button class="control-btn">
                            <span>Exaggerate</span>
                            <strong>1.0×</strong>
                        </button>

                        <button class="control-btn">
                            Elevation colours
                        </button>

                        <button class="control-btn">
                            Slope shading
                        </button>

                        <button class="control-btn">
                            Contours
                        </button>

                        <button class="control-btn">
                            Water level
                        </button>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 SCULPT BRUSH
            ========================================== -->

            <section class="control-section">

                <div
                    class="section-title"
                    onclick="toggleSection(this)"
                >

                    <div class="section-title-left">

                        <span class="section-icon">✦</span>

                        <span>SCULPT BRUSH</span>

                    </div>

                    <span class="arrow">⌄</span>

                </div>


                <div class="section-content">


                    <div class="button-grid">

                        <button class="control-btn">
                            Modify terrain
                        </button>

                        <button class="control-btn active">
                            Brush: RAISE
                        </button>

                    </div>


                    <!-- Radius -->

                    <div class="control-row">

                        <div class="control-label">

                            <span>Radius</span>

                            <strong id="radiusValue">
                                1500 m
                            </strong>

                        </div>

                        <div class="stepper">

                            <button onclick="changeRadius(-100)">
                                −
                            </button>

                            <button onclick="changeRadius(100)">
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Power -->

                    <div class="control-row">

                        <div class="control-label">

                            <span>Power</span>

                            <strong id="powerValue">
                                2.0 m
                            </strong>

                        </div>

                        <div class="stepper">

                            <button onclick="changePower(-0.5)">
                                −
                            </button>

                            <button onclick="changePower(0.5)">
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Max Height -->

                    <div class="control-row">

                        <div class="control-label">

                            <span>Max ht</span>

                            <strong id="maxHeightValue">
                                499 m
                            </strong>

                        </div>

                        <div class="stepper">

                            <button onclick="changeMaxHeight(-1)">
                                −
                            </button>

                            <button onclick="changeMaxHeight(1)">
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Undo / Redo -->

                    <div class="button-grid">

                        <button class="control-btn">
                            ↶ &nbsp; Undo
                        </button>

                        <button class="control-btn">
                            ↷ &nbsp; Redo
                        </button>

                        <button class="control-btn danger">
                            Reset
                        </button>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 SHAPING TOOLS
            ========================================== -->

            <section class="control-section">

                <div
                    class="section-title"
                    onclick="toggleSection(this)"
                >

                    <div class="section-title-left">

                        <span class="section-icon">◇</span>

                        <span>SHAPING TOOLS</span>

                    </div>

                    <span class="arrow">⌄</span>

                </div>


                <div class="section-content">


                    <div class="button-grid">

                        <button class="control-btn">
                            Grade path: ROAD
                        </button>

                        <button class="control-btn">
                            Grade flatten
                        </button>

                    </div>


                    <!-- Path Width -->

                    <div class="input-control">

                        <label>
                            Path width (m)
                        </label>

                        <div class="input-stepper">

                            <input
                                type="number"
                                id="pathWidth"
                                value="500"
                            >

                            <button
                                onclick="changeInput('pathWidth', -10)"
                            >
                                −
                            </button>

                            <button
                                onclick="changeInput('pathWidth', 10)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <!-- Dig Depth -->

                    <div class="input-control">

                        <label>
                            Dig depth (m, +down)
                        </label>

                        <div class="input-stepper">

                            <input
                                type="number"
                                id="digDepth"
                                value="0"
                            >

                            <button
                                onclick="changeInput('digDepth', -1)"
                            >
                                −
                            </button>

                            <button
                                onclick="changeInput('digDepth', 1)"
                            >
                                +
                            </button>

                        </div>

                    </div>


                    <div class="button-grid">

                        <button class="control-btn">
                            Stamp: DOME
                        </button>

                        <button class="control-btn">
                            Cross-section
                        </button>

                        <button class="control-btn">
                            Region offset
                        </button>

                        <button class="control-btn">
                            Rgn up
                        </button>

                        <button class="control-btn">
                            Rgn dn
                        </button>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 EROSION / EARTHWORK
            ========================================== -->

            <section class="control-section">

                <div
                    class="section-title"
                    onclick="toggleSection(this)"
                >

                    <div class="section-title-left">

                        <span class="section-icon">≈</span>

                        <span>EROSION / EARTHWORK</span>

                    </div>

                    <span class="arrow">⌄</span>

                </div>


                <div class="section-content">

                    <div class="button-grid">

                        <button class="control-btn">
                            Erode (water)
                        </button>

                        <button class="control-btn">
                            Talus
                        </button>

                        <button class="control-btn">
                            Balance cut/fill
                        </button>

                    </div>

                </div>

            </section>


            <!-- =========================================
                 SELECTION / MASK
            ========================================== -->

            <section class="control-section">

                <div
                    class="section-title"
                    onclick="toggleSection(this)"
                >

                    <div class="section-title-left">

                        <span class="section-icon">⬡</span>

                        <span>SELECTION / MASK</span>

                    </div>

                    <span class="arrow">⌄</span>

                </div>


                <div class="section-content">

                    <div class="button-grid">

                        <button class="control-btn">
                            Polygon select
                        </button>

                        <button
                            class="control-btn mask-btn"
                            id="maskButton"
                            onclick="toggleMask(event)"
                        >
                            Mask: OFF
                        </button>

                    </div>

                </div>

            </section>


        </div>

    </aside>


    <script src="script.js"></script>

</body>

</html>
